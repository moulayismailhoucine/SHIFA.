version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: medisys_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: medisys
      POSTGRES_PASSWORD: medisys_pass
      POSTGRES_DB: medisys_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medisys -d medisys_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: medisys_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://medisys:medisys_pass@db:5432/medisys_db
      APP_SECRET_KEY: ${APP_SECRET_KEY:-dev-secret-change-me}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      UPLOAD_DIR: /app/uploads
      APP_URL: ${APP_URL:-http://localhost:8000}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  uploads_data:
